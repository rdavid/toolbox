#
# Configures the typos spell checker. Skips the cfg/ytda.dne list and accepts
# project words such as the modeline, tool names, and short variables.
[files]
extend-exclude = ["cfg/ytda.dne"]

[default.extend-words]
dne = "dne"
noet = "noet"
tru = "tru"
FLE = "FLE"
SER = "SER"
