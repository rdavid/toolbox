# Runs redo on the macOS runners only. Ubuntu lacks a redo package, so the
# Linux legs are covered by the dedicated lint workflows instead.
---
name: test
'on':
  pull_request:
    paths: &paths
      - '**/*.do'
      - app/**
      - cfg/**
      - README.adoc
      - .github/workflows/test.yml
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      matrix:
        os:
          - macos-14
          - macos-15
          - macos-15-intel
          - macos-26
          - macos-26-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          brew install \
            rdavid/tap/goredo \
            rdavid/tap/shellbase
          redo -xx
