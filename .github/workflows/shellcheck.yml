#
# Checks the shell sources with shellcheck. The job downloads a pinned
# shellcheck release and runs it on the scripts directly. The previously used
# action matched additional files by basename through find -name, so path
# globs such as ./app/* never reached shellcheck and the job silently checked
# nothing. The runner image's apt package also trails several releases behind.
# Upstream publishes no checksums file, so the archive is verified against a
# pinned hash and a tampered or corrupted download fails the job.
---
name: shellcheck
'on':
  pull_request:
    paths: &paths
      - '**/*.do'
      - app/**
      - .github/workflows/shellcheck.yml
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: sh
jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          srv=https://github.com/koalaman/shellcheck
          sum=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          ver=0.11.0
          txz=shellcheck-v$ver.linux.x86_64.tar.xz
          curl \
            --fail \
            --location \
            --remote-name \
            --retry 3 \
            --show-error \
            --silent \
            "$srv/releases/download/v$ver/$txz"
          printf '%s  %s\n' "$sum" "$txz" | sha256sum --check
          tar \
            --extract \
            --file "$txz" \
            --strip-components=1 \
            --xz \
            shellcheck-v"$ver"/shellcheck
          ./shellcheck --version
          ./shellcheck ./*.do ./app/*
