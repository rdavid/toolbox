#
# Lints the GitHub Actions workflows. The release archive is verified against
# the upstream checksums file so a tampered or corrupted download fails the
# job instead of running. This replaces piping the upstream installer script
# into bash, which executed unverified code.
---
name: actionlint
'on':
  pull_request:
    paths: &paths
      - .github/workflows/**
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: sh
jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          srv=https://github.com/rhysd/actionlint
          ver=1.7.12
          tgz=actionlint_${ver}_linux_amd64.tar.gz
          curl \
            --fail \
            --location \
            --remote-name-all \
            --retry 3 \
            --show-error \
            --silent \
            "$srv/releases/download/v$ver/$tgz" \
            "$srv/releases/download/v$ver/actionlint_${ver}_checksums.txt"
          grep "$tgz\$" actionlint_"$ver"_checksums.txt | sha256sum --check
          tar --extract --file "$tgz" --gzip actionlint
          ./actionlint -version
          ./actionlint
