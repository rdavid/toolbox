# Enforces the Conventional Commits format required by AGENTS.md. On a pull
# request every commit ahead of the base branch is checked; conform's
# --base-branch flag needs the base ref present locally, which fetch-depth 0
# guarantees. The checkout pins ref to the pull request head commit rather
# than the default merge ref, since the merge ref's synthetic "Merge X into
# Y" commit is not a real commit on the branch and always fails conform's
# format checks. On a direct push to master only the landed commit is
# checked, since GITHUB_EVENT_NAME and GITHUB_BASE_REF are plain runner
# environment variables here, not template-expanded strings, the branching
# stays free of template injection. conform has no stable release yet, so
# the pin below tracks the latest alpha. The binary is verified against the
# upstream checksums file so a tampered or corrupted download fails the job
# instead of running.
---
name: conform
'on':
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: sh
jobs:
  conform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: >-
            ${{
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.sha ||
              github.sha
            }}
      - run: |
          srv=https://github.com/siderolabs/conform
          ver=0.1.0-alpha.31
          bin=conform-linux-amd64
          curl \
            --fail \
            --location \
            --remote-name-all \
            --retry 3 \
            --show-error \
            --silent \
            "$srv/releases/download/v$ver/$bin" \
            "$srv/releases/download/v$ver/sha256sum.txt"
          grep "$bin\$" sha256sum.txt | sha256sum --check
          mv "$bin" conform
          chmod +x conform
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            ./conform enforce --base-branch "origin/$GITHUB_BASE_REF"
          else
            ./conform enforce --commit-ref HEAD
          fi
