#
# Configures Dependabot to update the GitHub Actions daily, one pull request
# per action, after a seven-day cooldown. Commit messages use the ci prefix
# with a scope.
---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      include: scope
      prefix: ci
