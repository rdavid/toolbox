#
# Configures the lychee link checker. Excludes URLs that shell variables
# complete at run time and Stack Exchange sites, which reject automated
# requests with 403.
exclude = [
	'\$',
	'^https://stackoverflow\.com/',
	'^https://unix\.stackexchange\.com/',
]
